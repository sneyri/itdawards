<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111217">
  <title>Панель управления · ITD Awards</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/control/control.css">
  <link rel="stylesheet" href="/control/admin.css">
  <link rel="stylesheet" href="/control/tools.css">
  <script type="module" src="/control/admin.js"></script>
</head>
<body class="admin">
  <a class="skip" href="#workspace">К содержанию</a>
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <a class="admin-brand" href="#overview">
        <span class="brand-mark" aria-hidden="true">ITD</span>
        <div><strong>ITD Awards</strong><small>Панель управления</small></div>
      </a>
      <nav id="navigation" aria-label="Разделы админ-панели"></nav>
    </aside>
    <main id="workspace" class="workspace" tabindex="-1">
      <header class="admin-header">
        <strong id="section-name">Обзор</strong>
        <div id="header-status" aria-label="Состояние сервисов"><span class="status">Подключение…</span></div>
        <div class="header-actions">
          <button id="command-open" class="button command-open" type="button" aria-keyshortcuts="Control+K Meta+K" aria-haspopup="dialog"><span aria-hidden="true">⌕</span> Разделы <kbd>Ctrl K</kbd></button>
          <button id="effects-toggle" class="button subtle compact" type="button" aria-pressed="true">Эффекты: вкл.</button>
          <button id="refresh-panel" class="button subtle compact" type="button">Обновить</button>
          <div class="operator"><span id="operator-mark" class="operator-mark" aria-hidden="true">··</span><span><strong id="operator-name">Аккаунт</strong><small id="operator-role">Проверка сессии</small></span></div>
          <a class="button subtle compact" href="/nominations">На сайт</a>
          <button id="logout" class="button subtle compact" type="button">Выйти</button>
        </div>
      </header>
      <div id="view" class="view"><div class="skeleton" role="status" aria-label="Загрузка панели"><span></span><span></span><span></span></div></div>
    </main>
  </div>
  <dialog id="command-dialog" class="command-dialog" aria-labelledby="command-title"></dialog>
  <dialog id="dialog" class="dialog" aria-labelledby="dialog-title"></dialog>
  <div id="notifications" class="notifications" role="status" aria-live="polite"></div>
</body>
</html>
